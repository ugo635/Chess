plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.me.chess'
version = '1.0'

repositories {
    mavenCentral()
}

javafx {
    version = "26.0.2"
    modules = ['javafx.controls']
}

dependencies {
    implementation("org.jetbrains:annotations:26.1.0")
}

application {
    mainClass = "com.me.chess.Main"
    mainModule = "Chess.main"
}

tasks.register("createRuntimeImage", Exec) {
    dependsOn jar

    doFirst {
        def runtimeDir = file("$buildDir/runtime")
        delete runtimeDir

        def modulePath = files(
                "$buildDir/libs/Chess-1.0.jar",
                configurations.runtimeClasspath
        ).asPath

        commandLine(
                "jlink",
                "--module-path", modulePath,
                "--add-modules", "Chess.main",
                "--output", runtimeDir.absolutePath,
                "--strip-debug",
                "--no-header-files",
                "--no-man-pages"
        )
    }
}

tasks.register("packageExeInstantOpen", Exec) {
    dependsOn createRuntimeImage

    doFirst {
        def appDir = file("$buildDir/app")
        delete appDir
        appDir.mkdirs()

        commandLine(
                "jpackage",
                "--type", "app-image",
                "--name", "Chess",
                "--runtime-image", "$buildDir/runtime",
                "--module", "Chess.main/com.me.chess.Main",
                "--dest", appDir.absolutePath
        )
    }
}

tasks.register("countLines") {
    doLast {
        def files = fileTree("src").matching {
            include "**/*.java"
        }.files.collect { file ->
            [file: file, lines: file.readLines().size()]
        }.sort { a, b -> b.lines <=> a.lines }

        files.each {
            println "${it.file}: ${it.lines} lines"
        }

        println ""
        println "Total: ${files.sum { it.lines }} lines"
    }
}