# This workflow will build an executable to open the project

name: Build Windows App

on:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build app image
        run: .\gradlew packageExeInstantOpen

      - name: Zip app image
        run: Compress-Archive -Path build/app/Chess -DestinationPath build/Chess.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Chess
          path: build/Chess.zip
